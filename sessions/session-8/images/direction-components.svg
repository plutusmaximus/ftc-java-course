<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Forward movement split into horizontal and vertical parts</title>
  <desc id="desc">Two coordinate diagrams show one forward direction arrow when the robot faces 30 degrees and 120 degrees. Orange lines show the horizontal and vertical parts calculated with sine and cosine.</desc>

  <defs>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 23px Arial, sans-serif; fill: #0f172a; }
      .label { font: 17px Arial, sans-serif; fill: #0f172a; }
      .formula { font: 700 17px Arial, sans-serif; fill: #ea580c; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#axis-arrow); }
      .component { stroke: #ea580c; stroke-width: 4; }
      .direction { stroke: #2563eb; stroke-width: 5; marker-end: url(#blue-arrow); }
    </style>
  </defs>

  <rect width="1280" height="520" rx="18" fill="#f8fafc"/>
  <rect x="22" y="22" width="606" height="476" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="652" y="22" width="606" height="476" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g>
    <text x="325" y="58" text-anchor="middle" class="title">Robot faces 30°</text>

    <line x1="325" y1="335" x2="530" y2="335" class="axis"/>
    <line x1="325" y1="335" x2="325" y2="100" class="axis"/>
    <text x="534" y="358" class="label">+x</text>
    <text x="337" y="101" class="label">+y</text>

    <line x1="325" y1="335" x2="245" y2="335" class="component"/>
    <line x1="245" y1="335" x2="245" y2="196" class="component"/>
    <line x1="325" y1="335" x2="245" y2="196" class="direction"/>

    <text x="228" y="182" text-anchor="end" class="label" fill="#2563eb">forward</text>
    <text x="285" y="365" text-anchor="middle" class="formula">robotX = −sin(30°) = −0.50</text>
    <text x="228" y="268" text-anchor="end" class="formula">robotY = cos(30°) = 0.87</text>
    <text x="325" y="444" text-anchor="middle" class="label">horizontal part + vertical part</text>
  </g>

  <g>
    <text x="955" y="58" text-anchor="middle" class="title">Robot faces 120°</text>

    <line x1="955" y1="280" x2="1160" y2="280" class="axis"/>
    <line x1="955" y1="280" x2="955" y2="85" class="axis"/>
    <text x="1164" y="303" class="label">+x</text>
    <text x="967" y="86" class="label">+y</text>

    <line x1="955" y1="280" x2="816" y2="280" class="component"/>
    <line x1="816" y1="280" x2="816" y2="360" class="component"/>
    <line x1="955" y1="280" x2="816" y2="360" class="direction"/>

    <text x="795" y="382" text-anchor="end" class="label" fill="#2563eb">forward</text>
    <text x="885" y="267" text-anchor="middle" class="formula">robotX = −sin(120°) = −0.87</text>
    <text x="800" y="326" text-anchor="end" class="formula">robotY = cos(120°) = −0.50</text>
    <text x="955" y="444" text-anchor="middle" class="label">horizontal part + vertical part</text>
  </g>
</svg>
