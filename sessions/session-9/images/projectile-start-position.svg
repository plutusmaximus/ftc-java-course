<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 850 450" role="img" aria-labelledby="title desc">
  <title id="title">Projectile centered on the robot's front edge</title>
  <desc id="desc">A rotated robot and a projectile centered on its front edge. Their sizes and center coordinates are labeled with the constants used in the code, and the arrow from the robot center is labeled directionX, directionY.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .label { font: 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .direction-label { font: 17px Arial, sans-serif; fill: #2563eb; }
      .robot { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .direction { stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .projectile { fill: #fed7aa; stroke: #c2410c; stroke-width: 2; }
      .dimension { stroke: #64748b; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="850" height="450" fill="#ffffff"/>

  <!-- The 200-pixel drawing represents the robot's side. -->
  <g transform="rotate(-36 390 290)">
    <rect x="290" y="190" width="200" height="200" class="robot"/>
    <line x1="290" y1="410" x2="490" y2="410" class="dimension"/>
    <line x1="290" y1="400" x2="290" y2="420" class="dimension"/>
    <line x1="490" y1="400" x2="490" y2="420" class="dimension"/>
    <text x="390" y="435" text-anchor="middle" class="label">ROBOT_SIZE</text>
  </g>

  <!-- The 50-pixel drawing represents the projectile's side. -->
  <rect x="306" y="184" width="50" height="50" class="projectile"/>
  <text x="375" y="205" class="small">projectile center: (Projectile.SIZE / 2, Projectile.SIZE / 2)</text>

  <line x1="306" y1="166" x2="356" y2="166" class="dimension"/>
  <line x1="306" y1="157" x2="306" y2="175" class="dimension"/>
  <line x1="356" y1="157" x2="356" y2="175" class="dimension"/>
  <text x="331" y="151" text-anchor="middle" class="label">Projectile.SIZE</text>

  <!-- The arrow runs from the robot center to the center of its front edge. -->
  <line x1="390" y1="290" x2="331" y2="209" class="direction"/>
  <text x="342" y="260" text-anchor="end" class="direction-label">(directionX, directionY)</text>

  <circle cx="390" cy="290" r="5" fill="#0f172a"/>
  <text x="410" y="315" class="label">robot center: (ROBOT_SIZE / 2, ROBOT_SIZE / 2)</text>
  <circle cx="331" cy="209" r="4" fill="#7c3aed"/>
</svg>
